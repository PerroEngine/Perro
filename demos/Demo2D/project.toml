[project]
name = "Demo2D"
main_scene = "res://main.scn"
icon = "res://perro.svg"
startup_splash = "res://perro.svg"

[graphics]
aspect_ratio = "16:9"
vsync = false
anti_alias = "msaa4"
occlusion_culling = "off"
particle_sim_default = "gpu"

[ui]
pixel_snapping = true

[runtime]
# Cap to monitor refresh: uncapped pegs the GPU on frames that never display.
frame_rate_cap = "refresh_rate"
target_fixed_update = 60

[physics]
gravity = -9.81
coef = 1.0

[audio]
listener_max_distance = 500.0
propagation_tick_hz = 20
energy_cutoff = 0.02
debug_rays = false
max_bounces_2d = 4
rays_per_tick_2d = 64
max_ray_distance_2d = 500.0
