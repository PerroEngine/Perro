[package]
name = "perro_structs"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
bytemuck = { version = "1.24.0", features = ["derive"] }
glam = "0.31.0"
perro_ids.workspace = true

# Perf-sim core cap installs the shared rayon pool (see structs/devsim.rs).
# Native only: wasm has no thread pool to cap.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.10"

[dev-dependencies]
criterion = "0.5"
rayon = "1.10"

[[bench]]
name = "math_hotpaths"
harness = false

[[bench]]
name = "bitmask_hotpaths"
harness = false
