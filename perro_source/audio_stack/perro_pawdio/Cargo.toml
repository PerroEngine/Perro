[package]
name = "perro_pawdio"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
perro_asset_formats.workspace = true
perro_io.workspace = true
perro_ids.workspace = true
crossbeam-channel = { version = "0.5", optional = true }
cpal = { version = "0.15", optional = true }
midly = { version = "0.5.3", default-features = false, features = ["std"], optional = true }
rodio = { version = "0.17", default-features = true, optional = true }
rustysynth = { version = "1.3.6", optional = true }

[dev-dependencies]
criterion = "0.5"

[features]
default = ["playback"]
playback = ["dep:crossbeam-channel", "dep:cpal", "dep:midly", "dep:rodio", "dep:rustysynth"]
profile = ["playback"]
# Optional cpal capture backends. ASIO needs the Steinberg SDK + LLVM at build
# time (see cpal's README); JACK needs the system jack development library.
mic-asio = ["playback", "cpal/asio"]
mic-jack = ["playback", "cpal/jack"]

[[bench]]
name = "play_source"
harness = false

[[bench]]
name = "midi"
harness = false
