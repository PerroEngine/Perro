[package]
name = "perro_static_pipeline"
version.workspace = true
edition = "2024"

# zune-core = feature-unification only dep; no direct use. kp it.
[package.metadata.cargo-machete]
ignored = ["zune-core"]

[lints]
workspace = true

[dependencies]
perro_structs.workspace = true
perro_asset_formats.workspace = true
perro_io.workspace = true
perro_meshlets.workspace = true
perro_scene.workspace = true
perro_render_bridge.workspace = true
perro_graphics_assets.workspace = true
perro_animation.workspace = true
perro_resource_api.workspace = true
perro_project.workspace = true
perro_ids.workspace = true
perro_nodes.workspace = true
perro_wgsl.workspace = true
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tga", "ico"] }
# zune-jpeg (via image/resvg) calls `zune_core::log::warn!` in expression
# position; without `zune-core/log` those macros expand to nothing and the crate
# fails to compile. Enabling the feature here unifies it on for the whole graph.
zune-core = { version = "0.5.1", features = ["log"] }
gltf.workspace = true
rayon = "1.10"
perro_particle_math.workspace = true
perro_runtime.workspace = true
perro_ui.workspace = true
perro_csv.workspace = true
csv = "1.4"
bytemuck = { version = "1.24.0", features = ["derive"] }
pollster = "0.4.0"

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "30.0.0", default-features = false, features = ["std", "dx12", "vulkan", "wgsl"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "30.0.0", default-features = false, features = ["std", "vulkan", "wgsl"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30.0.0", default-features = false, features = ["std", "metal", "wgsl"] }
