[package]
name = "perro_macros"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
# not `workspace = true`: the proc-macro only minifies, so it opts out of the
# `check` feature and keeps naga out of every build that touches a macro.
perro_wgsl = { version = "0.1.0", path = "../perro_wgsl", default-features = false }
